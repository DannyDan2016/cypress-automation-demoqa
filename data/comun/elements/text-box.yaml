# Text Box (/text-box). Entradas del formulario y salida esperada en #output.
# Los textos esperados son literales de la UI, con sus erratas ("Permananet").
validacion:
  claseCampoInvalido: field-error

casos:
  valido: # TC-ELEM-001
    entrada:
      nombre: Juan Pérez
      email: juan.perez@example.com
      direccionActual: Calle 123, Bogotá
      direccionPermanente: Avenida 456, Medellín
    esperado:
      salida:
        nombre: 'Name:Juan Pérez'
        email: 'Email:juan.perez@example.com'
        direccionActual: 'Current Address :Calle 123, Bogotá'
        direccionPermanente: 'Permananet Address :Avenida 456, Medellín' # errata real del sitio

  caracteres_especiales: # TC-ELEM-005: no se interpreta como HTML
    entrada:
      nombre: Ñandú Güemes <b>negrita</b>
      email: nandu.guemes@example.com
      direccionActual: <script>alert('xss')</script>
      direccionPermanente: 'Carrera 7 #12-34, Cúcuta'
    esperado:
      salida:
        nombre: 'Name:Ñandú Güemes <b>negrita</b>'
        email: 'Email:nandu.guemes@example.com'
        direccionActual: "Current Address :<script>alert('xss')</script>"
        direccionPermanente: 'Permananet Address :Carrera 7 #12-34, Cúcuta'

  # TC-ELEM-002: el email inválido marca el campo y no se genera salida
  email_sin_dominio:
    entrada:
      nombre: Juan Pérez
      email: 'juan.perez@'
  email_sin_arroba:
    entrada:
      nombre: Juan Pérez
      email: juan.perez.example.com
  email_sin_usuario:
    entrada:
      nombre: Juan Pérez
      email: '@example.com'
