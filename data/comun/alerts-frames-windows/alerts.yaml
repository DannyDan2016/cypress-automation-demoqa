# Alerts (/alerts). Mensajes literales de los diálogos y del resultado en la página.
alertas:
  simple: # TC-AFW-010
    mensaje: You clicked a button
  temporizada: # TC-AFW-011
    mensaje: This alert appeared after 5 seconds
    retardoMs: 5000

confirmacion:
  mensaje: Do you confirm action?
  respuestas:
    aceptar: # TC-AFW-012
      acepta: true
      resultado: You selected Ok
    cancelar: # TC-AFW-013
      acepta: false
      resultado: You selected Cancel

prompt:
  mensaje: Please enter your name
  casos:
    nombre_valido: # TC-AFW-014
      respuesta: Ana García
      resultado: You entered Ana García
